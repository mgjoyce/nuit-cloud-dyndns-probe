name: Publish image

# Publishes ghcr.io/<owner>/dyndns-probe for linux/amd64 and linux/arm64: `latest` from main, vX.Y.Z from
# release tags, sha-<short> always. Also builds (without pushing) on pull requests, and smoke-tests the image.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Script syntax
        run: sh -n probe.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Smoke test (a probe with no configuration must stop and say what is missing)
        run: |
          docker build -t probe-smoke .
          set +e
          out=$(docker run --rm probe-smoke 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 2
          echo "$out" | grep -q NUIT_CLOUD_API_URL

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dyndns-probe
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
